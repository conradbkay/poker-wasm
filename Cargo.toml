[package]
name = "poker-wasm"
version = "2.0.0"
authors = ["Conrad Kay"]
repository = "https://github.com/conradkay/power-range-rs"
description = "WASM range vs range equity for NLHE"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

# Let wasm-opt keep optimizing while allowing the features rustc emits (+simd128,
# +bulk-memory, saturating float->int); otherwise it fails validation.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-O', '--enable-simd', '--enable-bulk-memory', '--enable-nontrapping-float-to-int']

[dependencies]
wasm-bindgen = "0.2.100"
rand = "0.9.1"
getrandom = { version = "0.3", features = ["wasm_js"] }
holdem-hand-evaluator = { git = "https://github.com/b-inary/holdem-hand-evaluator" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Keep debug symbols for profiling without sacrificing release optimizations.
[profile.profiling]
inherits = "release"
debug = true
strip = false

[dev-dependencies]
rand = "0.9.1"
criterion = { version = "0.6", features = ["html_reports"] }

[[bench]]
name = "equity_bench"
harness = false

[[bench]]
name = "holdem_fast"
harness = false
