[target.wasm32-unknown-unknown]
rustflags = [
  "--cfg", "getrandom_backend=\"wasm_js\"",
  # SIMD + bulk-memory. bulk-memory speeds up the memset/memcpy behind the
  # per-runout aggregation buffers (vec![Equity::default(); ..]) and Vec growth;
  # simd128 enables LLVM autovectorization of the mask/weight accumulation loops.
  # NOTE: a simd128 binary only runs on engines that support it (Chrome 91+,
  # Firefox 89+, Safari 16.4+). Drop +simd128 if you must support older browsers.
  "-C", "target-feature=+simd128,+bulk-memory",
]
